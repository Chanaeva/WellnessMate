<!DOCTYPE html>
<html>
<head>
    <title>Audio Test</title>
</head>
<body>
    <h1>Audio File Test</h1>
    <p>Testing if audio files can play directly</p>
    
    <h2>Thermal Springs</h2>
    <audio controls preload="auto">
        <source src="/audio/ambient/thermal-springs-bubbling.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    
    <h2>Tiber River</h2>
    <audio controls preload="auto">
        <source src="/audio/ambient/tiber-river-flow.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    
    <h2>Sacred Grove</h2>
    <audio controls preload="auto">
        <source src="/audio/ambient/sacred-grove-winds.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    
    <script>
        document.querySelectorAll('audio').forEach((audio, index) => {
            audio.addEventListener('error', (e) => {
                console.error(`Audio ${index} error:`, e);
                console.error(`Error code: ${audio.error?.code}`);
                console.error(`Error message: ${audio.error?.message}`);
            });
            audio.addEventListener('canplay', () => {
                console.log(`Audio ${index} can play!`);
            });
        });
    </script>
</body>
</html>
